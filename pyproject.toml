[project]
name = "yc-snippets"
version = "0.1.0"
description = "Скрипты инвентаризации и автоматизации ресурсов Yandex Cloud"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.scripts]
yc-snippets = "yc_snippets.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yc_snippets = ["data/*.json"]
