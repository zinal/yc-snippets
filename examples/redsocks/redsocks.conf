// /etc/redsocks.conf на клиенте Ubuntu 26.04.
// 192.168.0.10 — адрес Squid, порт 3128.
// Слушает только localhost: исходящие соединения сюда приносит iptables REDIRECT.
// На сервере Squid этот файл не ставят.

base {
	log_debug = off;
	log_info = on;
	log = "syslog:daemon";
	daemon = on;
	user = redsocks;
	group = redsocks;
	redirector = iptables;
}

// Обычный HTTP, порт 80. Squid принимает это как обычный прокси-запрос.
redsocks {
	local_ip = 127.0.0.1;
	local_port = 12345;
	ip = 192.168.0.10;
	port = 3128;
	type = http-relay;
}

// HTTPS, порт 443. Туннель CONNECT. В поставке Squid CONNECT разрешён только на 443.
redsocks {
	local_ip = 127.0.0.1;
	local_port = 12346;
	ip = 192.168.0.10;
	port = 3128;
	type = http-connect;
}
